<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a35">
<title>AppNho | Kết quả xổ số</title>
<style>
:root{--ink:#182230;--muted:#667085;--line:#e4e7ec;--bg:#f3f6fb;--card:#fff;--navy:#101a35;--blue:#3157d5;--red:#b42318;--green:#067647}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}header{background:linear-gradient(120deg,#101a35,#263f80);color:#fff;padding:25px 16px}.wrap{max-width:1160px;margin:auto}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:13px;background:#fff;color:#18254b;display:grid;place-items:center;font-weight:900;font-size:22px}h1{font-size:clamp(26px,4vw,35px);margin:3px 0}.sub{color:#d5def5;margin:8px 0 0}main{max-width:1160px;margin:auto;padding:20px 14px 42px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}.muted{color:var(--muted)}.small{font-size:12px}.btn,.tab{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#fff;color:var(--ink);font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.6;cursor:wait}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px}.filters label{font-weight:750}.date-picker-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.date-picker-wrap input{padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;color:var(--ink)}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.tab{border-radius:999px;padding:10px 15px}.tab.active{background:var(--navy);border-color:var(--navy);color:white}.region-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:12px 15px;background:#e9efff;border-left:5px solid var(--blue);border-radius:9px}.region-heading h2{margin:0;font-size:20px}.region-heading.mb{background:#e9efff;border-color:#3157d5}.region-heading.mt{background:#e7f8ef;border-color:#16804a}.region-heading.mn{background:#fff3e5;border-color:#c56a12}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 3px 14px #18223008;min-width:0}.station-grid,.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}.draw-head,.product-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}.card h2{margin:0;font-size:20px}.tag{display:inline-block;background:#eef2ff;color:#3538a3;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;white-space:nowrap}.tag.red{background:#fff0ed;color:var(--red)}.product-meta{font-size:13px;color:var(--muted);margin-top:4px}.prize-table{width:100%;border-collapse:collapse;margin-top:13px}.prize-table th,.prize-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.prize-table th{font-size:12px;color:var(--muted);background:#f8fafc}.prize-name{font-weight:750;white-space:nowrap;width:120px}.nums{display:flex;gap:7px;flex-wrap:wrap}.num{min-width:42px;min-height:36px;padding:5px 8px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:#eef2ff;color:#253b93;font-weight:850;font-variant-numeric:tabular-nums}.num.special{background:#fff0ed;color:var(--red);font-size:17px}.balls{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0 12px}.lotto-ball{width:44px;height:44px;border-radius:50%;background:#e9efff;color:#263b93;display:grid;place-items:center;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}.lotto-ball.power{background:#fff0ed;color:var(--red)}.lotto-ball.three{border-radius:10px;width:52px;height:48px}.draw-time{font-weight:850;color:#9f1239;background:#fff1f2;border:1px solid #fecdd3;border-radius:9px;padding:8px 10px;display:block;margin:10px 0}.empty{border:1px dashed #cbd5e1;border-radius:12px;padding:24px;background:#f8fafc;color:var(--muted)}.group-title{font-size:20px;margin:22px 0 10px}.error{color:#b42318}
@media(max-width:680px){.station-grid,.product-grid{grid-template-columns:1fr}.prize-table th,.prize-table td{padding:8px 6px}.prize-name{width:auto}.num{min-width:37px;min-height:34px}.lotto-ball{width:39px;height:39px;font-size:17px}.filters{align-items:flex-start}.filters input{max-width:100%}}
</style></head>
<body>
<header><div class="wrap"><div class="brand"><div class="logo">A</div><div><div class="small" style="color:#c6d2ff;font-weight:800;letter-spacing:.12em">APPNHO · TIỆN ÍCH</div><h1>Kết quả xổ số</h1></div></div><p class="sub">Tra cứu kết quả theo ngày. Các đài miền Bắc, miền Trung, miền Nam và từng sản phẩm Vietlott được trình bày riêng biệt.</p></div></header>
<main>
<div class="toolbar"><div><strong id="status">Đang tải kết quả…</strong><div class="muted small" id="updated">Đang đọc kho dữ liệu lịch sử.</div></div><button class="btn primary" id="reload">Tải lại kết quả</button></div>
<div class="filters"><label for="draw-date">Tra cứu:</label><div class="date-picker-wrap"><button class="btn" type="button" id="pick-date">Xem kết quả ngày khác</button><input type="date" id="draw-date" aria-label="Chọn ngày cần xem" title="Chọn ngày cần xem"><button class="btn" id="clear-date" type="button">Về ngày mới nhất</button></div><span class="muted small" id="date-note">Đang hiển thị kết quả mới nhất. Chọn ngày khác nếu muốn tra cứu lịch sử.</span></div>
<nav class="tabs" aria-label="Chọn miền hoặc sản phẩm"><button class="tab active" data-kind="xsmb">Miền Bắc</button><button class="tab" data-kind="xsmt">Miền Trung</button><button class="tab" data-kind="xsmn">Miền Nam</button><button class="tab" data-kind="vietlott">Vietlott</button></nav>
<section id="content"><div class="empty">Đang tải dữ liệu…</div></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);let records=[],manifest=null,active='xsmb',selectedDate='';
const PRODUCT_ORDER=['POWER 6/55','MEGA 6/45','LOTTO 5/35','MAX 3D'];
// Read published data directly from the main branch. GitHub Pages may not rebuild
// automatically after a workflow pushes with GITHUB_TOKEN.
const DATA_BASE='https://raw.githubusercontent.com/qualokhach/xo_so/main/';
function dataUrl(path){return DATA_BASE+String(path||'').replace(/^\/+/, '');}
const CENTRAL_STATIONS=['Thừa Thiên Huế','Huế','Kon Tum','Khánh Hòa','Đà Nẵng','Quảng Nam','Quảng Ngãi','Bình Định','Phú Yên','Ninh Thuận','Đắk Lắk','Đắk Nông','Gia Lai'];
const SOUTHERN_STATIONS=['TP. Hồ Chí Minh','Hồ Chí Minh','Đồng Nai','Cần Thơ','Sóc Trăng','An Giang','Bình Dương','Bình Phước','Bình Thuận','Bạc Liêu','Bến Tre','Cà Mau','Đồng Tháp','Hậu Giang','Kiên Giang','Long An','Tiền Giang','Trà Vinh','Vĩnh Long','Tây Ninh','Vũng Tàu'];
const $date=()=>selectedDate;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateText(v){if(!v)return 'Ngày chưa rõ';let m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:esc(v)}
function productType(d){
 const s=((d.product||'')+' '+(d.title||'')+' '+(d.station||'')+' '+(d.product_id||'')).toUpperCase().replace(/\s+/g,' ');
 if(/POWER\s*6\s*[\/／]\s*55|POWER655/.test(s))return 'POWER 6/55';
 if(/MEGA\s*6\s*[\/／]\s*45|MEGA645/.test(s))return 'MEGA 6/45';
 if(/LOTTO\s*5\s*[\/／]\s*35|LOTTO535/.test(s))return 'LOTTO 5/35';
 if(/MAX\s*3D|MAX3D/.test(s))return 'MAX 3D';
 return d.product||d.title||'Vietlott';
}
function isBadStation(d){const s=String(d.station||d.title||'').trim();return !s||/^Đài\s*\d+$/i.test(s)||/(Hồ Chí MinhĐồng|Phú YênThừa|Kon TumKhánh)/i.test(s)}
function stationFitsKind(d){
 // `kind` is assigned by the collector's source-specific region parser. Do not
 // reject valid stations merely because a source uses a new spelling/diacritic.
 // Still reject clearly malformed concatenations and generic placeholders.
 const name=String(d.station||d.title||'').trim();
 if(!name || /^Đài\s*\d+$/i.test(name)) return false;
 if(/(?:Hồ Chí MinhĐồng|Phú YênThừa|Kon TumKhánh|Đà NẵngQuảng)/i.test(name)) return false;
 return ['xsmb','xsmt','xsmn'].includes(d.kind);
}
function sortedDraws(list){return [...list].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.draw_time||b.datetime||b.draw_datetime||'').localeCompare(String(a.draw_time||a.datetime||a.draw_datetime||''))||String(b.draw_no||b.draw_number||b.draw_id||'').localeCompare(String(a.draw_no||a.draw_number||a.draw_id||''),undefined,{numeric:true}))}
function numberHTML(nums,special=false){if(!Array.isArray(nums)||!nums.length)return '<span class="muted">—</span>';return '<div class="nums">'+nums.map(n=>'<span class="num'+(special?' special':'')+'">'+esc(n)+'</span>').join('')+'</div>'}
const PRIZE_RANK={'đặc biệt':0,'giải đặc biệt':0,'jackpot 1':1,'jackpot 2':2,'jackpot':3,'giải nhất':4,'giải nhì':5,'giải ba':6,'giải tư':7,'giải năm':8,'giải sáu':9,'giải bảy':10,'giải tám':11};
function sortedPrizes(d){return [...(d.prizes||[])].sort((a,b)=>(PRIZE_RANK[String(a.name||'').toLocaleLowerCase('vi')]??50)-(PRIZE_RANK[String(b.name||'').toLocaleLowerCase('vi')]??50))}
function traditionalCard(d){const prizes=sortedPrizes(d);return '<article class="card"><div class="draw-head"><div><h2>'+esc(d.station||d.title||'Đài xổ số')+'</h2><div class="product-meta">Ngày quay: '+dateText(d.date)+'</div></div></div><table class="prize-table"><thead><tr><th>Giải</th><th>Kết quả</th></tr></thead><tbody>'+prizes.map(p=>'<tr><td class="prize-name">'+esc(p.name)+'</td><td>'+numberHTML(p.numbers,/đặc biệt/i.test(p.name))+'</td></tr>').join('')+'</tbody></table></article>'}
function extractMainNumbers(d){const prizes=d.prizes||[];let p=prizes.find(x=>/bộ số trúng thưởng|số trúng thưởng|kết quả quay số/i.test(x.name||''));if(p){const nums=p.numbers||[];if(productType(d)==='LOTTO 5/35'&&nums.length>=6)return {main:nums.slice(0,5),extra:nums.slice(5,6)};if(productType(d)==='POWER 6/55'&&nums.length>=7)return {main:nums.slice(0,6),extra:nums.slice(6,7)};return {main:nums,extra:[]};}let jackpot=prizes.find(x=>/jackpot/i.test(x.name||''));if(jackpot){let nums=jackpot.numbers||[];if(productType(d)==='POWER 6/55'&&nums.length>=7)return {main:nums.slice(0,6),extra:nums.slice(6,7)};if(productType(d)==='MEGA 6/45')return {main:nums.slice(0,6),extra:[]}}return {main:[],extra:[]}}
function lottoCard(d){const type=productType(d),prizes=sortedPrizes(d),drawNo=d.draw_no||d.draw_number||d.draw_id||d.drawNo||'',drawDate=dateText(d.date),drawTime=d.draw_time||d.draw_datetime||d.datetime||d.time||'';let main=extractMainNumbers(d);const is3d=type==='MAX 3D';const numbers=main.main.length?'<div class="balls">'+main.main.map(n=>'<span class="lotto-ball'+(is3d?' three':'')+'">'+esc(n)+'</span>').join('')+main.extra.map(n=>'<span class="lotto-ball power">'+esc(n)+'</span>').join('')+'</div>':'';const details=prizes.length?'<table class="prize-table"><thead><tr><th>Hạng giải</th><th>Kết quả</th></tr></thead><tbody>'+prizes.map(p=>'<tr><td class="prize-name">'+esc(p.name)+'</td><td>'+numberHTML(p.numbers,/jackpot|đặc biệt/i.test(p.name))+'</td></tr>').join('')+'</tbody></table>':'';let drawMeta='Ngày quay: '+drawDate;if(type==='LOTTO 5/35'){drawMeta='<div class="draw-time">Kỳ quay: '+(drawNo?esc(drawNo):'Chưa có mã kỳ')+'<br>Ngày: '+drawDate+'<br>Giờ quay: '+(drawTime?esc(drawTime):'Chưa có giờ quay trong dữ liệu nguồn')+'</div>'}else if(drawNo){drawMeta+=' · Kỳ quay: '+esc(drawNo)}return '<article class="card"><div class="product-title"><h2>'+esc(type)+'</h2><span class="tag red">'+(drawNo?'Kỳ '+esc(drawNo):'Kết quả')+'</span></div><div class="product-meta">'+drawMeta+'</div>'+numbers+details+'</article>'}
function renderTraditional(){let list=records.filter(d=>d.kind===active&&d.date&&d.prizes?.length&&!isBadStation(d)&&stationFitsKind(d));if(selectedDate){list=list.filter(d=>String(d.date).slice(0,10)===selectedDate)}else if(list.length){const latest=list.map(d=>String(d.date).slice(0,10)).filter(Boolean).sort().at(-1);list=list.filter(d=>String(d.date).slice(0,10)===latest)}list=sortedDraws(list);const map=new Map();for(const d of list){const key=[d.date,d.station||d.title].join('|');if(!map.has(key))map.set(key,d)}list=[...map.values()];if(!list.length){$('content').innerHTML='<div class="empty">Không có kết quả phù hợp với ngày đã chọn. Hãy thử ngày khác hoặc xóa bộ lọc ngày.</div>';return}const region={xsmb:['Miền Bắc','mb'],xsmt:['Miền Trung','mt'],xsmn:['Miền Nam','mn']}[active];$('content').innerHTML='<div class="region-heading '+region[1]+'"><h2>Xổ số '+region[0]+'</h2><span class="tag">'+list.length+' đài / kỳ</span></div><div class="station-grid">'+list.map(traditionalCard).join('')+'</div>'}
function renderVietlott(){
 let list=records.filter(d=>d.kind==='vietlott'&&PRODUCT_ORDER.includes(productType(d))&&d.date&&Array.isArray(d.prizes));
 if(selectedDate){list=list.filter(d=>String(d.date).slice(0,10)===selectedDate)}
 else {
   // Each product has its own draw calendar. Do not force Power, Mega, 3D and Lotto
   // to share one date. Lotto may have two sessions on the same date: keep both.
   const latestByProduct={};
   for(const d of list){const t=productType(d);const stamp=String(d.date).slice(0,10)+'T'+String(d.draw_time||d.draw_datetime||d.datetime||'00:00');if(!latestByProduct[t]||stamp>latestByProduct[t])latestByProduct[t]=stamp}
   list=list.filter(d=>{const t=productType(d),day=String(d.date).slice(0,10);if(t==='LOTTO 5/35')return day===String(latestByProduct[t]||'').slice(0,10);const stamp=day+'T'+String(d.draw_time||d.draw_datetime||d.datetime||'00:00');return stamp===latestByProduct[t]})
 }
 const groups={};for(const d of sortedDraws(list)){const t=productType(d);(groups[t]??=[]).push(d)}let html='';
 for(const type of PRODUCT_ORDER){const items=groups[type]||[];if(!items.length){if(!selectedDate)html+='<h2 class="group-title">'+type+'</h2><div class="empty">Chưa có bản ghi hợp lệ cho sản phẩm này. Bộ thu thập chưa lấy được dữ liệu; không hiển thị số suy đoán.</div>';continue}html+='<h2 class="group-title">'+type+'</h2><div class="product-grid">'+items.map(lottoCard).join('')+'</div>'}
 if(!html)html='<div class="empty">Không có kết quả Vietlott phù hợp với ngày đã chọn. Hãy thử ngày khác hoặc bấm “Về ngày mới nhất”.</div>'; $('content').innerHTML=html
}
function render(){if(active==='vietlott')renderVietlott();else renderTraditional();$('date-note').textContent=selectedDate?'Đang hiển thị kết quả ngày '+dateText(selectedDate)+'.':'Đang hiển thị kết quả mới nhất. Chọn ngày khác để tra cứu lịch sử.'}
async function fetchJson(path){const r=await fetch(dataUrl(path)+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path+' HTTP '+r.status);return r.json()}
function unpackRecords(file){return Object.values((file&&file.records)||{})}
async function load(){const button=$('reload');button.disabled=true;$('status').textContent='Đang tải dữ liệu…';$('updated').textContent='Đang đọc chỉ mục và dữ liệu lịch sử.';try{let errors=[];try{manifest=await fetchJson('data/index.json')}catch(e){errors.push(e.message);manifest=null}records=[];
// First use the manifest, but don't trust an empty/stale manifest as proof that no data exists.
if(manifest&&Array.isArray(manifest.files)&&manifest.files.length){const settled=await Promise.allSettled(manifest.files.map(f=>fetchJson(f.url)));for(let i=0;i<settled.length;i++){const result=settled[i];if(result.status==='fulfilled')records.push(...unpackRecords(result.value));else errors.push(result.reason.message)}}
// Recovery path: discover monthly partitions by deterministic filenames when the manifest is empty/stale.
if(!records.length){const now=new Date();const paths=[];for(let i=0;i<25;i++){const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-i,1));paths.push('data/archive/'+d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'.json')}paths.push('data/archive/lotto-5-35.json','data/results.json','data/archive.json');const settled=await Promise.allSettled(paths.map(fetchJson));for(const result of settled){if(result.status==='fulfilled')records.push(...unpackRecords(result.value));}}
// Deduplicate across fallback files by stable key; prefer the first record encountered.
const unique=new Map();for(const rec of records){const key=rec.key||[rec.kind,rec.product||'',rec.date||'',rec.draw_no||rec.draw_number||'',rec.station||rec.title||''].join('|');if(!unique.has(key))unique.set(key,rec)}records=[...unique.values()];
const updateStamp=manifest&&manifest.updated_at_vietnam?new Date(manifest.updated_at_vietnam).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}):'chưa rõ';$('status').textContent='Đã tải '+records.length+' bản ghi';$('updated').textContent='Cập nhật: '+updateStamp+' · giờ Việt Nam';if(!records.length){$('status').textContent='Chưa tìm thấy dữ liệu kết quả';$('updated').textContent='Không có bản ghi trong chỉ mục hoặc các tệp dữ liệu dự phòng. Hãy kiểm tra data/index.json và data/archive/ trên nhánh main.';$('content').innerHTML='<div class="empty">Chưa tải được bản ghi kết quả. Đã thử chỉ mục, các tệp dữ liệu theo tháng và kho dữ liệu cũ. Vui lòng kiểm tra dữ liệu đã được commit lên nhánh main chưa.</div>';return;}render()}catch(e){$('status').textContent='Không tải được dữ liệu';$('updated').textContent=e.message;$('content').innerHTML='<div class="empty">'+esc(e.message)+'. Hãy kiểm tra repository và tải lại trang.</div>'}finally{button.disabled=false}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.kind;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()}));$('draw-date').addEventListener('change',e=>{selectedDate=e.target.value;render()});$('pick-date').addEventListener('click',()=>{const input=$('draw-date');if(input.showPicker){try{input.showPicker();return}catch(_){}}input.focus();input.click()});$('clear-date').addEventListener('click',()=>{$('draw-date').value='';selectedDate='';render()});$('reload').addEventListener('click',load);load();
</script></body></html>
