name: Update lottery results

on:
  workflow_dispatch:
  # Vietnam time (UTC+7): run every 15 minutes during the 16:00–19:00 window.
  # Use minute offsets (UTC 09:05–11:50) to avoid relying on the top of the hour,
  # when GitHub scheduled workflows are more prone to queue delays.
  # Local run times: 16:05, 16:20, 16:35, 16:50 ... through 18:50.
  schedule:
    - cron: "5,20,35,50 9-11 * * *"

permissions:
  contents: write

concurrency:
  group: lottery-results-update
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser and test dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pytest
      - name: Verify collector syntax
        run: python -m py_compile scripts/fetch_results.py
      - name: Run all collector and regression tests
        run: python -m pytest -q
      - name: Collect, validate, lock and prune by retention policy
        run: python scripts/fetch_results.py
      - name: Validate partition manifest and all published records
        run: |
          python - <<'PY'
          import json, re, os, sys
          sys.path.insert(0, "scripts")
          import fetch_results
          m=json.load(open("data/index.json",encoding="utf-8"))
          assert m.get("schema_version")==3
          total=0
          for f in m.get("files",[]):
              assert os.path.isfile(f["url"]), f["url"]
              d=json.load(open(f["url"],encoding="utf-8"))
              for rec in d.get("records",{}).values():
                  assert fetch_results.record_valid(rec), (f["url"], rec.get("key"), "invalid record")
                  assert rec.get("date") and rec.get("prizes")
                  if rec.get("kind") in ("xsmb","xsmt","xsmn"):
                      assert rec.get("station") and not re.match(r"Đài\s*\d+$",rec["station"],re.I)
                  if rec.get("kind")=="vietlott":
                      assert rec.get("product") in ("MEGA 6/45","POWER 6/55","LOTTO 5/35","MAX 3D","MAX 3D+","MAX 3D PRO")
              total += len(d.get("records",{}))
          assert total == m.get("record_count"), (total,m.get("record_count"))
          print("Validated",total,"records in",len(m.get("files",[])),"partitions")
          PY
      - name: Commit and publish data with remote-update retry
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # First attempt uses the data collected above. If another commit lands
          # on main before push, reset to the newest main and recollect against
          # that current history so partition files are merged by the collector,
          # rather than force-pushing or overwriting another run's data.
          for attempt in 1 2 3; do
            git add -A -- data/index.json data/archive/ data/archive-quarantine.json
            if git diff --cached --quiet; then
              echo "No data changes; no commit needed."
              exit 0
            fi

            git commit -m "data: update partitioned lottery results"

            if git push origin HEAD:main; then
              echo "Published lottery data successfully on attempt ${attempt}."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts; inspect remote permissions or branch protection."
              exit 1
            fi

            echo "Push rejected; preserving collected data before syncing latest main (attempt ${attempt}/3)."
            # Preserve the exact collected snapshot before resetting the checkout.
            # This prevents a transient source failure on retry from losing valid results.
            snapshot="${RUNNER_TEMP}/lottery-collected-snapshot-${attempt}"
            rm -rf "$snapshot"
            mkdir -p "$snapshot"
            cp -a data/. "$snapshot/"
            git fetch origin main
            git reset --hard origin/main
            # Merge only valid unseen records from the snapshot into latest remote data.
            # Existing remote records win on duplicate keys; never force-push.
            python -m py_compile scripts/fetch_results.py scripts/merge_collected_data.py
            python scripts/merge_collected_data.py --snapshot "$snapshot" --target data
            # Recollect against merged history, regenerate the manifest and apply retention.
            python scripts/fetch_results.py
          done
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appnho-lottery-partitioned-data
          path: |
            data/index.json
            data/archive/**/*.json
            data/archive-quarantine.json
          if-no-files-found: warn
          retention-days: 30
