name: Update lottery results

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. GitHub scheduled workflows may be delayed.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: lottery-results-update
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Fetch and parse lottery results
        run: python scripts/fetch_results.py
      - name: Publish JSON to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update lottery results"
            git push
          fi
      - name: Upload result JSON for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appnho-lottery-results
          path: data/results.json
          if-no-files-found: warn
          retention-days: 14
