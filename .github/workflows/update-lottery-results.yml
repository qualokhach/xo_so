name: Update lottery results

on:
  workflow_dispatch:
  # Vietnam time (UTC+7): scan only 16:15–19:00, every 15 minutes.
  # 16:15–16:45 VN = 09:15–09:45 UTC; 17:00–18:45 VN = 10:00–11:45 UTC; 19:00 VN = 12:00 UTC.
  schedule:
    - cron: "15,30,45 9 * * *"
    - cron: "0,15,30,45 10,11 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: lottery-results-update
  cancel-in-progress: true

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser and test dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pytest
      - name: Verify collector syntax
        run: python -m py_compile scripts/fetch_results.py
      - name: Run all collector and regression tests
        run: python -m pytest -q
      - name: Collect, validate, lock and prune by retention policy
        run: python scripts/fetch_results.py
      - name: Validate partition manifest and all published records
        run: |
          python - <<'PY'
          import json, re, os, sys
          sys.path.insert(0, "scripts")
          import fetch_results
          m=json.load(open("data/index.json",encoding="utf-8"))
          assert m.get("schema_version")==3
          total=0
          for f in m.get("files",[]):
              assert os.path.isfile(f["url"]), f["url"]
              d=json.load(open(f["url"],encoding="utf-8"))
              for rec in d.get("records",{}).values():
                  assert fetch_results.record_valid(rec), (f["url"], rec.get("key"), "invalid record")
                  assert rec.get("date") and rec.get("prizes")
                  if rec.get("kind") in ("xsmb","xsmt","xsmn"):
                      assert rec.get("station") and not re.match(r"Đài\s*\d+$",rec["station"],re.I)
                  if rec.get("kind")=="vietlott":
                      assert rec.get("product") in ("MEGA 6/45","POWER 6/55","LOTTO 5/35","MAX 3D","MAX 3D+","MAX 3D PRO")
              total += len(d.get("records",{}))
          assert total == m.get("record_count"), (total,m.get("record_count"))
          print("Validated",total,"records in",len(m.get("files",[])),"partitions")
          PY
      - name: Commit only changed data files
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/index.json data/archive/
          if git diff --cached --quiet; then
            echo "No data changes; no commit needed."
          else
            git commit -m "data: update partitioned lottery results"
            git push origin HEAD:main
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appnho-lottery-partitioned-data
          path: |
            data/index.json
            data/archive/**/*.json
            data/archive-quarantine.json
          if-no-files-found: warn
          retention-days: 30
