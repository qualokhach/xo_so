name: Update lottery results

on:
  workflow_dispatch:
  # Vietnam local time (IANA timezone is supported by GitHub Actions).
  # 16:05, 16:20, 16:35, 16:50 ... 18:50, then 19:05.
  # Avoid :00 to reduce GitHub schedule queue contention.
  schedule:
    - cron: "5,20,35,50 16-18 * * *"
      timezone: "Asia/Ho_Chi_Minh"
    - cron: "5 19 * * *"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: write

concurrency:
  group: lottery-results-update
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Log trigger and guard scheduled execution window
        id: schedule_guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GIT_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh"))
          event = os.environ.get("EVENT_NAME", "unknown")
          cron = os.environ.get("EVENT_SCHEDULE", "")
          ref = os.environ.get("GIT_REF", "")
          print(f"Event: {event}")
          print(f"Schedule cron: {cron or '(not a scheduled event)'}")
          print(f"Git ref: {ref}")
          print(f"Vietnam local time: {now.isoformat(timespec='seconds')}")

          # Manual runs remain available at any time. Scheduled runs outside the
          # intended 16:00-19:30 Vietnam window are skipped to prevent accidental
          # midnight publishing if the workflow schedule is ever misconfigured.
          allowed = event != "schedule" or (
              time(16, 0) <= now.timetz().replace(tzinfo=None) <= time(19, 30)
          )
          if not allowed:
              print("::warning::Scheduled run is outside 16:00-19:30 Asia/Ho_Chi_Minh; collection will be skipped.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"allowed={'true' if allowed else 'false'}\n")
          PY
      - name: Set up Python
        if: steps.schedule_guard.outputs.allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser and test dependencies
        if: steps.schedule_guard.outputs.allowed == 'true'
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pytest
      - name: Verify collector syntax
        if: steps.schedule_guard.outputs.allowed == 'true'
        run: python -m py_compile scripts/fetch_results.py
      - name: Run all collector and regression tests
        if: steps.schedule_guard.outputs.allowed == 'true'
        run: python -m pytest -q
      - name: Collect, validate, lock and prune by retention policy
        if: steps.schedule_guard.outputs.allowed == 'true'
        run: python scripts/fetch_results.py
      - name: Validate partition manifest and all published records
        if: steps.schedule_guard.outputs.allowed == 'true'
        run: |
          python - <<'PY'
          import json, re, os, sys
          sys.path.insert(0, "scripts")
          import fetch_results
          m=json.load(open("data/index.json",encoding="utf-8"))
          assert m.get("schema_version")==3
          total=0
          for f in m.get("files",[]):
              assert os.path.isfile(f["url"]), f["url"]
              d=json.load(open(f["url"],encoding="utf-8"))
              for rec in d.get("records",{}).values():
                  assert fetch_results.record_valid(rec), (f["url"], rec.get("key"), "invalid record")
                  assert rec.get("date") and rec.get("prizes")
                  if rec.get("kind") in ("xsmb","xsmt","xsmn"):
                      assert rec.get("station") and not re.match(r"Đài\s*\d+$",rec["station"],re.I)
                  if rec.get("kind")=="vietlott":
                      assert rec.get("product") in ("MEGA 6/45","POWER 6/55","LOTTO 5/35","MAX 3D","MAX 3D+","MAX 3D PRO")
              total += len(d.get("records",{}))
          assert total == m.get("record_count"), (total,m.get("record_count"))
          print("Validated",total,"records in",len(m.get("files",[])),"partitions")
          PY
      - name: Commit and publish data with remote-update retry
        if: steps.schedule_guard.outputs.allowed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # First attempt uses the data collected above. If another commit lands
          # on main before push, reset to the newest main and recollect against
          # that current history so partition files are merged by the collector,
          # rather than force-pushing or overwriting another run's data.
          for attempt in 1 2 3; do
            git add -A -- data/index.json data/archive/ data/archive-quarantine.json
            if git diff --cached --quiet; then
              echo "No data changes; no commit needed."
              exit 0
            fi

            git commit -m "data: update partitioned lottery results"

            if git push origin HEAD:main; then
              echo "Published lottery data successfully on attempt ${attempt}."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after 3 attempts; inspect remote permissions or branch protection."
              exit 1
            fi

            echo "Push rejected; preserving collected data before syncing latest main (attempt ${attempt}/3)."
            snapshot="${RUNNER_TEMP}/lottery-collected-snapshot-${attempt}"
            rm -rf "$snapshot"
            mkdir -p "$snapshot"
            cp -a data/. "$snapshot/"
            git fetch origin main
            git reset --hard origin/main
            python -m py_compile scripts/fetch_results.py scripts/merge_collected_data.py
            python scripts/merge_collected_data.py --snapshot "$snapshot" --target data
            python scripts/fetch_results.py
          done
      - name: Upload diagnostics
        if: always() && steps.schedule_guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: appnho-lottery-partitioned-data
          path: |
            data/index.json
            data/archive/**/*.json
            data/archive-quarantine.json
          if-no-files-found: warn
          retention-days: 30
