name: Update lottery results

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: lottery-results-update
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python script syntax
        run: python -m py_compile scripts/fetch_results.py
      - name: Fetch and parse lottery results
        run: python scripts/fetch_results.py
      - name: Show collection summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/results.json",encoding="utf-8"))
          for s in d.get("sources",[]):
              print(f"{s.get('id')}: {s.get('status')} | draws={s.get('draw_count')} | {s.get('message','')}")
          PY
      - name: Publish JSON to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update lottery results"
            git push origin HEAD:main
          fi
      - name: Upload result JSON for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appnho-lottery-results
          path: data/results.json
          if-no-files-found: warn
          retention-days: 14
